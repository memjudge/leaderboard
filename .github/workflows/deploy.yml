name: Deploy

# Rebuilds the site from memjudge/results and deploys it to Cloudflare Workers.
# Runs on pushes here, when memjudge/results sends `results-updated`, or by hand.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [results-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: memjudge/results
          path: results
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Artifacts are immutable (named by content hash), so earlier downloads stay valid.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/artifacts
          key: artifacts-${{ hashFiles('results/runs/*.json') }}
          restore-keys: artifacts-
      # PUBLIC_*_COMMIT: the footer names the commits this build was made from.
      - run: PUBLIC_RESULTS_COMMIT=$(git -C results rev-parse HEAD) npm run build
        env:
          PUBLIC_SITE_COMMIT: ${{ github.sha }}
          RESULTS_DIR: results
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # Cloudflare's API sometimes fails a deploy with a transient error (e.g.
      # code 10013 on the asset upload), so try up to 3 times before failing.
      - run: |
          for attempt in 1 2 3; do
            npx wrangler deploy && exit 0
            echo "::warning::wrangler deploy failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
