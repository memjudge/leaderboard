name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run check
      # Build from the signed test fixtures (synthetic runs, test key) with production rules.
      - run: npm run build
        env:
          RESULTS_DIR: tests/fixtures/results
          KEYS_DIR: tests/fixtures/keys
          ARTIFACTS_DIR: tests/fixtures/artifacts
          SEASONS_FILE: tests/fixtures/seasons.json
